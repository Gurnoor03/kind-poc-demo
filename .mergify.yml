pull_request_rules:
  - name: bot-command-loop-test
    conditions:
      - head = copy-rce-trigger
      - -label = bot-comment-fired
    actions:
      label:
        add: [bot-comment-fired]
      comment:
        message: |-
          @Mergifyio refresh

  - name: detect-refresh-event
    conditions:
      - label = bot-comment-fired
    actions:
      comment:
        message: |-
          [LOOP-TEST] If you see this comment, Mergify reprocessed the PR after bot posted @Mergifyio refresh.
          PR-cycler-addr=[{{ cycler(1,2) | string }}]

merge_protections_settings:
  reporting_method: check-runs
