# post_check rule 'queue-everything-with-post-check' was removed without replacement (no success_conditions or neutral_conditions to migrate)
queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions: []
    commit_message_template: |
      [MERGE-QUEUE-BYPASS] cycler=[{{ cycler(1,2) | string }}]
      author=[{{ author }}]

pull_request_rules:
  - name: queue-everything-with-post-check
    conditions: []
    actions:
      queue:
        name: default
merge_protections_settings:
  reporting_method: check-runs
