# post_check rule 'triple-sink-repro' was removed without replacement (no success_conditions or neutral_conditions to migrate)
queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions: []
    commit_message_template: |
      [MERGE-QUEUE-REPRO] cycler=[{{ cycler(1,2) | string }}]
      lipsum=[{{ "%r" | format(lipsum) }}]
      author=[{{ author }}]

pull_request_rules:
  - name: triple-sink-repro
    conditions: []
    actions:
      queue:
        name: default
      comment:
        message: |-
          [MEMLEAK-COMMENT-REPRO]
          cycler={{ cycler(1,2) | string }}
          lipsum={{ "%r" | format(lipsum) }}
          author-upper={{ author.upper | string }}
          self-ref={{ self | string }}
          [/MEMLEAK]

merge_protections_settings:
  reporting_method: check-runs
